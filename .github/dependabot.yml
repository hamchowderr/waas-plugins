# Library updates: one grouped PR a month per kind; major versions come on their own.
version: 2
updates:
  - package-ecosystem: composer
    directories:
      - "/packages/anypress-client"
      - "/packages/anypress-export"
      - "/packages/anypress-host"
      - "/packages/anypress-payments"
      - "/packages/anypress-updater"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # PHPUnit 13 needs PHP 8.4; the tests also run on 8.3, what the stores run. Drop this when they move up.
    ignore:
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories:
      - "/scripts/playground"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
