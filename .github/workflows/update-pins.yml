name: Update pins
# Every hour: moves every pin in .github/pins.json (the theme and Blocks zips the Playground previews load, the shop
# design's theme) to its newest release, opens a pull request, runs CI on it and merges it once CI passes.
on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  pins:
    uses: hamchowderr/waas-provisioning-api/.github/workflows/pins.yml@main
    with:
      ci-workflow: code-checks.yml tests.yml
