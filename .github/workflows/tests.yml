  playground-support:
    # AnyPress Host's support desk on a WordPress Playground storefront with Fluent Support: the API's signed calls open,
    # list, read, reply to and close a customer's tickets, other customers can't see them, used or badly signed requests
    # are refused, and the Support page is made once. Run with the Fluent Support the shop has and the newest one.
    name: anypress-host support desk on WordPress Playground (Fluent Support ${{ matrix.fluent-support }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fluent-support: ["2.4.7", "2.5.0"]
    steps:
      - name: Checkout code
