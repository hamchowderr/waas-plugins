  playground-languages:
    # The Languages switch on a Playground store of the online-store and community site types: Polylang set up once
    # when turned on, a page's Spanish copy at /es/, the menu's language switcher and links, and turning it off.
    name: anypress-client Languages on WordPress Playground (${{ matrix.site-type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site-type: ["online-store", "community"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template's site types
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
