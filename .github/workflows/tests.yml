name: Tests
on:
  pull_request:
  push:
    branches:
      - main
  # The Update pins workflow starts it on its pull request's branch this way.
  workflow_dispatch:
jobs:
  unit:
    name: ${{ matrix.package }} unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [anypress-host, anypress-client, anypress-payments, anypress-updater, anypress-export]
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: Run unit tests
        run: composer test -- --exclude-group mock

  release-scripts:
    # Builds, stamps, signs and verifies all three plugins with a throwaway key, and runs publish and
    # promote against a fake bucket. Nothing is uploaded.
    name: Release scripts (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2
      - name: The plugins' updater copies are in sync
        run: scripts/sync-updater.sh --check
      - name: Release scripts
        run: scripts/release/test.sh

  js:
    name: anypress-payments checkout script tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/anypress-payments
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run checkout script tests
        run: node --test 'tests/js/*.test.mjs'

  contract:
    # Runs the plugin's real API client against the public Postman mock. It depends on an outside service,
    # so it reports but doesn't block a pull request.
    name: anypress-host contract tests (Postman mock)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/anypress-host
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: Run contract tests
        run: composer test -- --group mock

  playground:
    # AnyPress Client on real WordPress (WordPress Playground: WordPress and PHP in Node, no Docker) with the AnyPress
    # theme and the store template's starter pages, calling the AnyPress connector's site-editing routes.
    name: anypress-client on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Smoke test
        working-directory: scripts/playground
        run: npm run smoke

  playground-export:
    # AnyPress Export on a messy WordPress Playground site, moved to a stand-in AnyPress API in many short
    # requests; checks the archive that arrives (files, database dump, a file split across requests).
    name: anypress-export on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-export
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Export test
        working-directory: scripts/playground
        run: npm run export

  playground-forms:
    # The forms switch (wp anypress forms switch and its abilities) on a WordPress Playground site with Contact Form 7,
    # Flamingo, WPForms Lite, Ninja Forms and Fluent Forms: converts, fixes, switches the pages, runs again, undoes.
    name: anypress-client forms switch on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Forms switch test
        working-directory: scripts/playground
        run: npm run forms

  playground-gravity-forms:
    # The forms switch's Gravity Forms source on WordPress Playground, against a stand-in for Gravity Forms' PHP API
    # (Gravity Forms is paid): converts with the importer's mistakes fixed, entries, pages, runs again, undoes.
    name: anypress-client forms switch from Gravity Forms on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Gravity Forms switch test
        working-directory: scripts/playground
        run: npm run gravity-forms

  playground-edd:
    # The shop switch's Easy Digital Downloads source on WordPress Playground: the FluentCart Migrator add-on copies the
    # EDD shop, EDD's shortcodes and blocks on pages become FluentCart's, runs again, undoes.
    name: anypress-client shop switch from Easy Digital Downloads on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: EDD shop switch test
        working-directory: scripts/playground
        run: npm run edd

  playground-crm-import:
    # AnyPress Client's Brevo and MailerLite importers in FluentCRM's Import screen on WordPress Playground, through
    # the official SDKs against fake Brevo and MailerLite APIs.
    name: anypress-client Brevo and MailerLite importers on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template (roles.json)
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: templates/anypress-store/roles.json
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: CRM importers test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
        run: npm run crm-import

  playground-shop-switch:
    # The shop switch (wp anypress shop switch and its abilities) on a WordPress Playground site with WooCommerce,
    # FluentCart and the FluentCart Migrator add-on (downloaded from FluentCart's add-ons CDN): checks, switches,
    # runs again, undoes, and compares the two shops, with HPOS off and then on.
    name: anypress-client shop switch on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Shop switch test
        working-directory: scripts/playground
        run: npm run shop-switch

  playground-crm-switch:
    # The CRM switch (wp anypress crm switch and its abilities) on a WordPress Playground site with WooCommerce, FluentCRM,
    # MailPoet and the Newsletter plugin: checks, switches, runs again, undoes, and checks no email goes out, with
    # HPOS off and then on.
    name: anypress-client CRM switch on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: CRM switch test
        working-directory: scripts/playground
        run: npm run crm-switch

  playground-phone:
    # The phone receptionist's store routes (/site/phone/*) on a WordPress Playground site with FluentBooking and
    # FluentCRM: services, open times, a phone booking, the same time refused, and the caller saved with tags.
    name: anypress-client phone routes on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Phone routes test
        working-directory: scripts/playground
        run: npm run phone

  playground-highlevel:
    # AnyPress Client's HighLevel link on a WordPress Playground site with WP Fusion Lite: the store asks the API for its
    # sub-account and token (signed), WP Fusion connects to HighLevel by itself, and a new user becomes a tagged contact.
    name: anypress-client HighLevel link on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: HighLevel link test
        working-directory: scripts/playground
        run: npm run highlevel

  playground-moving:
    # The support, affiliate and community switches (wp anypress support|affiliate|community switch and their abilities)
    # on a WordPress Playground site with Fluent Support, FluentAffiliate and FluentCommunity next to Awesome Support,
    # SliceWP and BuddyPress: checks, switches, runs again, undoes, and checks no email goes out.
    name: anypress-client support, affiliate and community switches on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Support, affiliate and community switch test
        working-directory: scripts/playground
        run: npm run moving

  playground-cache-checkout:
    # The store page cache around FluentCart's shop, product, cart and checkout pages, on a Playground store of the
    # online-store site type: a real browser adds to cart and places an order while a cookie-less visitor keeps getting
    # cached pages, and no saved page holds a shopper's details.
    name: Store page cache around FluentCart cart and checkout on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template and the store agent's page cache
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: |
            templates/anypress-store/roles.json
            templates/anypress-store/build.sh
            templates/anypress-store/plugins/fluent-cart-migrator-*.zip
            src/provisioner/coolify/agent.php
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground and Playwright
        working-directory: scripts/playground
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Cache around cart and checkout test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
        run: npm run cache-checkout
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-checkout
          path: scripts/playground/shots/cache-checkout/

  playground-courses:
    # The course switch (wp anypress course switch and its abilities): LearnDash courses, students and progress into
    # FluentCommunity courses, on a Playground store of the community site type, with the store's FluentCommunity and
    # the newest one: checks, switches, runs again, undoes, redoes, and checks no email goes out.
    name: anypress-client course switch on WordPress Playground (FluentCommunity ${{ matrix.fluent-community }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fluent-community: ["2.12.0", "2.13.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template's site types
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: templates/anypress-store/roles.json
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Course switch test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
          FLUENT_COMMUNITY: ${{ matrix.fluent-community }}
        run: npm run courses

  playground-lms:
    # The course switch from Tutor LMS and LifterLMS (both from wordpress.org): their courses, students and progress
    # into FluentCommunity courses, on a Playground store of the community site type, with the store's FluentCommunity
    # and the newest one: checks, switches, runs again, undoes, and checks no email goes out.
    name: anypress-client course switch from Tutor LMS and LifterLMS on WordPress Playground (FluentCommunity ${{ matrix.fluent-community }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fluent-community: ["2.12.0", "2.13.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template's site types
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: templates/anypress-store/roles.json
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Tutor LMS and LifterLMS course switch test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
          FLUENT_COMMUNITY: ${{ matrix.fluent-community }}
        run: npm run lms

  playground-move:
    # AnyPress Move, the switches as their own plugin for any WordPress site: built from AnyPress Client's switches,
    # on a plain WordPress with FluentCommunity and Tutor LMS. The Tools page's Check, Switch and Undo, the abilities
    # and WP-CLI commands, and that it does nothing when AnyPress Client is active.
    name: anypress-move on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Build AnyPress Move
        run: |
          scripts/build-move.sh
          (cd packages/anypress-move && composer install --no-dev --no-interaction --no-progress)
          (cd packages/anypress-client && composer install --no-dev --no-interaction --no-progress)
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: AnyPress Move test
        working-directory: scripts/playground
        run: npm run move

  playground-memberpress:
    # The MemberPress switch (wp anypress memberpress switch and its abilities): active members into FluentCommunity
    # spaces and courses with FluentCRM tags, on a Playground store of the community site type: checks, switches,
    # runs again, undoes, and checks no email goes out.
    name: anypress-client MemberPress switch on WordPress Playground (FluentCommunity ${{ matrix.fluent-community }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fluent-community: ["2.12.0", "2.13.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template's site types
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: templates/anypress-store/roles.json
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: MemberPress switch test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
          FLUENT_COMMUNITY: ${{ matrix.fluent-community }}
        run: npm run memberpress

  playground-circle:
    # The Circle switch (wp anypress circle switch and its abilities): a Circle community into FluentCommunity through a
    # fake Circle Admin API, on a Playground store of the community site type, with the store's FluentCommunity and the
    # newest one: checks with no, a wrong and the right token, switches, runs again, undoes, redoes, and checks the
    # token is saved nowhere and no email goes out.
    name: anypress-client Circle switch on WordPress Playground (FluentCommunity ${{ matrix.fluent-community }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fluent-community: ["2.12.0", "2.13.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template's site types
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: templates/anypress-store/roles.json
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Circle switch test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
          FLUENT_COMMUNITY: ${{ matrix.fluent-community }}
        run: npm run circle

  playground-skool:
    # The Skool switch (wp anypress skool switch --file and its abilities): a Skool group's Members tab CSV into
    # FluentCommunity and FluentCRM, on a Playground store of the community site type, with the store's FluentCommunity
    # and the newest one: checks with no file, a file without emails and the sample file, switches, runs again, undoes,
    # redoes into an existing space, and checks the file is saved nowhere and no email goes out.
    name: anypress-client Skool switch on WordPress Playground (FluentCommunity ${{ matrix.fluent-community }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fluent-community: ["2.12.0", "2.13.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout the store template's site types
        uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-provisioning-api
          path: waas-provisioning-api
          sparse-checkout: templates/anypress-store/roles.json
          sparse-checkout-cone-mode: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Skool switch test
        working-directory: scripts/playground
        env:
          ANYPRESS_API_DIR: ${{ github.workspace }}/waas-provisioning-api
          FLUENT_COMMUNITY: ${{ matrix.fluent-community }}
        run: npm run skool

