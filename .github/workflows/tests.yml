name: Tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  unit:
    name: ${{ matrix.package }} unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [waas-host, waas-client, waas-payments, waas-updater, anypress-export]
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: Run unit tests
        run: composer test -- --exclude-group mock

  release-scripts:
    # Builds, stamps, signs and verifies all three plugins with a throwaway key, and runs publish and
    # promote against a fake bucket. Nothing is uploaded.
    name: Release scripts (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2
      - name: The plugins' updater copies are in sync
        run: scripts/sync-updater.sh --check
      - name: Release scripts
        run: scripts/release/test.sh

  js:
    name: waas-payments checkout script tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/waas-payments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run checkout script tests
        run: node --test 'tests/js/*.test.mjs'

  contract:
    # Runs the plugin's real API client against the public Postman mock. It depends on an outside service,
    # so it reports but doesn't block a pull request.
    name: waas-host contract tests (Postman mock)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/waas-host
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: Run contract tests
        run: composer test -- --group mock

  playground:
    # WaaS Client on real WordPress (WordPress Playground: WordPress and PHP in Node, no Docker) with the Ollie
    # theme and the store template's starter pages, calling the AnyPress connector's site-editing routes.
    name: waas-client on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/waas-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Smoke test
        working-directory: scripts/playground
        run: npm run smoke

  playground-export:
    # AnyPress Export on a messy WordPress Playground site, moved to a stand-in AnyPress API in many short
    # requests; checks the archive that arrives (files, database dump, a file split across requests).
    name: anypress-export on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/anypress-export
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Export test
        working-directory: scripts/playground
        run: npm run export

  playground-forms:
    # The forms switch (wp waas forms switch and its abilities) on a WordPress Playground site with Contact Form 7,
    # Flamingo, WPForms Lite, Ninja Forms and Fluent Forms: converts, fixes, switches the pages, runs again, undoes.
    name: waas-client forms switch on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/waas-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Forms switch test
        working-directory: scripts/playground
        run: npm run forms

  playground-shop-switch:
    # The shop switch (wp waas shop switch and its abilities) on a WordPress Playground site with WooCommerce,
    # FluentCart and the FluentCart Migrator add-on (downloaded from FluentCart's add-ons CDN): checks, switches,
    # runs again, undoes, and compares the two shops, with HPOS off and then on.
    name: waas-client shop switch on WordPress Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: packages/waas-client
        run: composer install --no-dev --no-interaction --no-progress
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/playground/package-lock.json
      - name: Install Playground
        working-directory: scripts/playground
        run: npm ci
      - name: Shop switch test
        working-directory: scripts/playground
        run: npm run shop-switch
