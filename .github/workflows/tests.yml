name: Tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  waas-host:
    name: waas-host unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: packages/waas-host
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: Run tests
        run: composer test
